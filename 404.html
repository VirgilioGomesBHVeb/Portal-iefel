<!DOCTYPE html>
<html lang="pt-MZ">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal IEFEL | Página Não Encontrada</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="topo">
        <div class="contentor barra">
            <a class="marca" href="/" aria-label="Página inicial Portal IEFEL">
                <img src="/imagens/logo.png" alt="Logotipo da Igreja Evangélica Forças Espirituais da Luz" class="simbolo" width="43" height="43">
                <span>
                    <strong>Portal IEFEL</strong>
                    <small>MAPUTO</small>
                </span>
            </a>
            <nav class="menu" aria-label="Navegação principal">
                <a href="/">Início</a>
                <a href="/sobre">Sobre</a>
                <a href="/ministerios">Ministérios</a>
                <a href="/estudos">Estudos</a>
                <a href="/eventos">Eventos</a>
                <a href="/galeria">Galeria</a>
                <a href="/contactos">Contactos</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="pagina-hero">
            <div class="contentor" style="text-align: center; padding: 4rem 1rem;">
                <span class="etiqueta">Erro 404</span>
                <h1>Página Não Encontrada</h1>
                <p>O conteúdo que procura não existe ou mudou de endereço.</p>
                <div class="botoes" style="margin-top: 1.5rem; justify-content: center; display: flex;">
                    <a class="botao" href="/">Voltar ao Início</a>
                </div>
            </div>
        </section>
    </main>

    <footer class="rodape">
        <div class="contentor">
            <div class="copyright">&copy; 2026 Portal IEFEL. Projecto académico de Fundamentos de HTML5.</div>
        </div>
    </footer>
</body>
</html>
